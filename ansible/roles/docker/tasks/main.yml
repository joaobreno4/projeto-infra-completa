---
- name: Instalar dependencias do Docker
  apt:
    name:
      - ca-certificates
      - gnupg
      - lsb-release
    state: present

- name: Adicionar chave GPG do Docker
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Adicionar repositorio oficial do Docker
  apt_repository:
    repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    state: present

- name: Instalar Docker e Docker Compose
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: Garantir que o Docker esta ativo no boot
  service:
    name: docker
    state: started
    enabled: yes

- name: Adicionar usuario ubuntu ao grupo docker
  user:
    name: ubuntu
    groups: docker
    append: yes
